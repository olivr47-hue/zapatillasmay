<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi carrito — Zapatillas May</title>
  <meta name="description" content="Tu carrito de compras en Zapatillas May. Revisa tus productos y finaliza tu pedido.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://zapatillasmay.mx/carrito">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap"></noscript>
  <style>
    :root {
      --pink: #9c5a52;
      --pink-dark: #b5687a;
      --tan: #9c5a52;
      --mauve: #b5687a;
      --black: #2A1A0E;
      --bg: #FAF8F6;
      --surface: #FFFFFF;
      --surface-2: #F7EDE4;
      --border: rgba(200,150,122,0.14);
      --border-med: rgba(200,150,122,0.28);
      --gray: #8B6A54;
      --gray-light: #C4A38A;
      --font-display: 'Cormorant Garamond', serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :focus-visible { outline: 2px solid #8B6A54; outline-offset: 2px; border-radius: 3px; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--black); -webkit-font-smoothing: antialiased; min-height: 100vh; }

    /* Fondo decorativo */
    body::before {
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(ellipse 70% 50% at 15% 0%, rgba(200,150,122,0.06) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(181,104,122,0.05) 0%, transparent 55%);
    }

    /* HEADER */
    .header { position: sticky; top: 0; z-index: 100; background: rgba(250,248,246,0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; height: 60px; }
    .header-back { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--gray); text-decoration: none; cursor: pointer; background: none; border: none; font-family: var(--font-body); transition: color 0.15s; }
    .header-back:hover { color: var(--pink); }
    .header-back svg { flex-shrink: 0; }
    .header-logo { font-family: var(--font-display); font-size: 1.45rem; font-weight: 400; letter-spacing: 0.3px; color: var(--black); text-decoration: none; }
    .header-logo span { color: var(--pink); font-style: italic; }
    .header-right { width: 60px; }

    /* LAYOUT */
    .page { max-width: 720px; margin: 0 auto; padding: 28px 16px 120px; position: relative; z-index: 1; }
    h1 { font-family: var(--font-display); font-size: 2.2rem; font-weight: 400; margin-bottom: 2px; letter-spacing: -0.3px; }
    .subtitle { font-size: 0.8rem; color: var(--gray-light); margin-bottom: 26px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }

    /* EMPTY */
    .empty { text-align: center; padding: 70px 20px; }
    .empty-icon { font-size: 3.5rem; margin-bottom: 16px; }
    .empty h2 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 400; margin-bottom: 8px; }
    .empty p { font-size: 0.88rem; color: var(--gray); margin-bottom: 26px; }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 32px; background: linear-gradient(135deg, #C8967A, #b5687a); color: white; border: none; border-radius: 100px; font-family: var(--font-body); font-size: 0.88rem; font-weight: 700; cursor: pointer; text-decoration: none; box-shadow: 0 4px 16px rgba(200,150,122,0.35); transition: transform 0.2s, box-shadow 0.2s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(200,150,122,0.5); }

    /* ITEMS */
    .items-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; display: flex; gap: 14px; padding: 14px; position: relative; box-shadow: 0 2px 10px rgba(90,40,10,0.05); transition: transform 0.2s, box-shadow 0.2s; }
    .item-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(90,40,10,0.09); }
    .item-img { width: 84px; height: 100px; flex-shrink: 0; border-radius: 12px; object-fit: cover; background: #f5f0eb; }
    .item-img-placeholder { width: 84px; height: 100px; flex-shrink: 0; border-radius: 12px; background: #f5f0eb; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 0.95rem; font-weight: 600; line-height: 1.3; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--black); }
    .item-meta { font-size: 0.72rem; color: var(--gray-light); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.4px; }
    .item-price { font-size: 0.95rem; font-weight: 700; font-family: var(--font-mono); color: var(--mauve); }
    .item-price-each { font-size: 0.7rem; color: var(--gray-light); font-family: var(--font-mono); font-weight: 400; }
    .item-corrida-badge { display: inline-block; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; background: rgba(200,150,122,0.12); color: var(--tan); border-radius: 100px; padding: 3px 9px; margin-bottom: 6px; }
    .item-qty { display: flex; align-items: center; gap: 6px; margin-top: 10px; background: var(--surface-2); border-radius: 100px; padding: 3px; width: fit-content; }
    .qty-btn { width: 28px; height: 28px; border: none; border-radius: 50%; background: transparent; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; color: var(--gray); transition: all 0.15s; font-family: var(--font-body); font-weight: 700; }
    .qty-btn:hover { background: white; color: var(--mauve); transform: scale(1.1); }
    .qty-val { font-size: 0.88rem; font-weight: 700; font-family: var(--font-mono); min-width: 22px; text-align: center; color: var(--black); }
    .item-remove { position: absolute; top: 12px; right: 12px; background: none; border: none; cursor: pointer; color: var(--gray-light); font-size: 0.95rem; transition: color 0.15s; padding: 4px; }
    .item-remove:hover { color: #e74c3c; }

    /* MAYOREO BANNER */
    .mayoreo-hint { background: linear-gradient(135deg, rgba(200,150,122,0.1), rgba(181,104,122,0.06)); border: 1px solid rgba(200,150,122,0.22); border-radius: 14px; padding: 13px 16px; margin-bottom: 16px; font-size: 0.82rem; color: #7a5a48; display: flex; align-items: center; gap: 10px; }
    .mayoreo-hint strong { color: var(--mauve); }

    /* RESUMEN */
    .resumen { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(90,40,10,0.05); }
    .resumen-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 0.85rem; color: var(--gray); }
    .resumen-row.total { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 16px; font-weight: 700; font-size: 1rem; color: var(--black); }
    .resumen-row.total .val { font-family: var(--font-mono); font-size: 1.3rem; color: var(--black); }
    .resumen-row .badge-desc { font-size: 0.7rem; color: var(--tan); font-weight: 600; margin-left: 6px; }
    .precio-tachado { text-decoration: line-through; color: var(--gray-light); font-size: 0.8rem; margin-right: 4px; font-family: var(--font-mono); }

    /* BOTONES FINALES */
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-checkout { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 17px; background: linear-gradient(135deg, #C8967A, #b5687a); color: white; border: none; border-radius: 100px; font-family: var(--font-body); font-size: 0.95rem; font-weight: 700; cursor: pointer; letter-spacing: 0.3px; box-shadow: 0 6px 22px rgba(200,150,122,0.4); transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; }
    .btn-checkout::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent); pointer-events:none; }
    .btn-checkout:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(200,150,122,0.55); }
    .btn-checkout:active { transform: scale(0.98); }
    .btn-checkout:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-seguir { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 14px; background: var(--surface); color: var(--gray); border: 1.5px solid var(--border-med); border-radius: 100px; font-family: var(--font-body); font-size: 0.88rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; }
    .btn-seguir:hover { border-color: var(--pink); color: var(--pink); background: var(--surface-2); }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2A1A0E; color: white; padding: 11px 22px; border-radius: 100px; font-size: 0.83rem; font-weight: 600; opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 9999; white-space: nowrap; box-shadow: 0 8px 24px rgba(42,26,14,0.3); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* CHECKOUT OVERLAY */
    .overlay { position: fixed; inset: 0; background: rgba(42,26,14,0.45); z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .overlay.active { display: flex; }
    .modal-box { background: var(--bg); border-radius: 24px; width: 100%; max-width: 480px; max-height: 92vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(42,26,14,0.3); animation: coSlideUp 0.35s var(--ease-spring); }
    @keyframes coSlideUp { from { opacity:0; transform:translateY(30px) scale(0.97);} to { opacity:1; transform:translateY(0) scale(1);} }
    .modal-head { background: linear-gradient(135deg,#C8967A,#b5687a); padding: 24px 28px 20px; position: relative; flex-shrink: 0; }
    .modal-head .close { position:absolute; top:18px; right:18px; background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:34px; height:34px; cursor:pointer; font-size:1rem; color:white; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .modal-eyebrow { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:rgba(255,255,255,0.7); margin-bottom:6px; }
    .modal-title { font-family: var(--font-display); font-size: 1.9rem; font-weight: 400; color: white; line-height: 1; }
    .modal-subtitle { font-size: 0.85rem; color: rgba(255,255,255,0.85); margin-top: 8px; }
    .modal-subtitle strong { font-family: var(--font-mono); font-size: 1.05rem; }
    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    .field { margin-bottom: 11px; }
    .field input, .field textarea { width: 100%; border: 1.5px solid var(--border-med); border-radius: 10px; padding: 11px 14px; font-family: var(--font-body); font-size: 0.875rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; background: white; color: var(--black); }
    .field input::placeholder, .field textarea::placeholder { color: var(--gray-light); }
    .field input:focus, .field textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(200,150,122,0.12); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pagos-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--tan); margin: 16px 0 8px; }
    .pagos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .pago-badge { background: rgba(200,150,122,0.07); border-radius: 8px; padding: 7px 10px; font-size: 0.74rem; font-weight: 500; color: #5a4030; }
    .modal-actions { display: flex; gap: 10px; padding: 14px 24px; background: white; border-top: 1px solid var(--border); flex-shrink: 0; }
    .modal-actions .cancel { flex: 1; padding: 14px; background: transparent; border: 1.5px solid var(--border-med); border-radius: 100px; font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; color: var(--gray); cursor: pointer; transition: all 0.2s; }
    .modal-actions .cancel:hover { background: var(--surface-2); }
    .modal-actions .confirm { flex: 2; padding: 14px; background: linear-gradient(135deg,#C8967A,#b5687a); color: white; border: none; border-radius: 100px; font-family: var(--font-body); font-size: 0.85rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(200,150,122,0.4); transition: transform 0.2s, box-shadow 0.2s; }
    .modal-actions .confirm:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(200,150,122,0.5); }
    .modal-actions .confirm:disabled { opacity: 0.6; cursor: not-allowed; }

    @media (max-width: 600px) {
      .item-card { padding: 12px; gap: 12px; }
      .item-img, .item-img-placeholder { width: 72px; height: 88px; }
      h1 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>

<header class="header">
  <a class="header-back" href="javascript:history.back()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    Inicio
  </a>
  <a class="header-logo" href="/">Zapatillas <span>May</span></a>
  <div class="header-right"></div>
</header>

<div class="page">
  <h1>Mi carrito</h1>
  <p class="subtitle" id="carrito-subtitle">Cargando...</p>

  <div id="carrito-vacio" class="empty" style="display:none">
    <div class="empty-icon">🛍️</div>
    <h2>Tu carrito está vacío</h2>
    <p>Agrega productos para comenzar tu pedido.</p>
    <a href="/" class="btn-primary">Ver catálogo</a>
  </div>

  <div id="carrito-contenido" style="display:none">
    <div id="mayoreo-hint" class="mayoreo-hint" style="display:none">
      <span>💡</span>
      <span id="mayoreo-hint-texto"></span>
    </div>

    <div class="items-list" id="items-list"></div>

    <div class="resumen" id="resumen-box"></div>

    <div class="actions">
      <button class="btn-checkout" id="btn-checkout" onclick="abrirCheckout()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        Finalizar compra
      </button>
      <a href="/" class="btn-seguir">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        Seguir comprando
      </a>
    </div>
  </div>
</div>

<!-- CHECKOUT OVERLAY -->
<div class="overlay" id="checkout-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <button class="close" onclick="cerrarCheckout()" aria-label="Cerrar">✕</button>
      <p class="modal-eyebrow">Finalizar compra</p>
      <p class="modal-title">Datos de envío</p>
      <p class="modal-subtitle">Total a pagar: <strong id="modal-total"></strong></p>
    </div>
    <div class="modal-body">
      <div class="field"><input id="co-nombre" placeholder="Nombre completo *"></div>
      <div class="field"><input id="co-email" type="email" placeholder="Email *"></div>
      <div class="field"><input id="co-telefono" type="tel" placeholder="Teléfono *"></div>
      <div class="field"><input id="co-calle" placeholder="Calle y número *"></div>
      <div class="field field-row">
        <input id="co-colonia" placeholder="Colonia *">
        <input id="co-cp" placeholder="Código postal *">
      </div>
      <div class="field field-row">
        <input id="co-ciudad" placeholder="Ciudad *">
        <input id="co-estado" placeholder="Estado *">
      </div>
      <div class="field"><textarea id="co-notas" placeholder="Notas adicionales (opcional)" rows="2"></textarea></div>
      <p class="pagos-label">Métodos de pago aceptados</p>
      <div class="pagos-grid">
        <span class="pago-badge">💳 Tarjeta</span>
        <span class="pago-badge">🏦 SPEI</span>
        <span class="pago-badge">🏪 OXXO</span>
        <span class="pago-badge">💰 MercadoPago</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="cancel" onclick="cerrarCheckout()">Cancelar</button>
      <button class="confirm" id="btn-confirmar" onclick="procesarPago()">Pagar ahora</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://zapatillasmay-production.up.railway.app'
let carrito = []
let cfgEnvio = { tier1: 99, tier2: 150, tier3: 199, gratis_desde: 1299 }  // defaults

// ── LEER CARRITO ─────────────────────────────────────────────────
function leerCarrito() {
  try {
    return JSON.parse(sessionStorage.getItem('zm_carrito') || '[]')
  } catch(e) { return [] }
}

function guardarCarrito() {
  sessionStorage.setItem('zm_carrito', JSON.stringify(carrito))
}

// ── PRECIO DINÁMICO POR VOLUMEN ──────────────────────────────────
function calcularPrecioUnitario(item, totalPares) {
  if (item.es_oferta) return item.precio_unitario
  if (totalPares >= 6 || item.es_corrida) {
    return item.precio_corrida || item.precio_mayoreo6 || item.precio_mayoreo3 || item.precio_menudeo
  }
  if (totalPares >= 3) {
    return item.precio_mayoreo3 || item.precio_menudeo
  }
  return item.precio_menudeo
}

function totalPares(carrito) {
  return carrito.reduce((s, i) => s + (i.es_corrida ? (i.cantidad * 6) : i.cantidad), 0)
}

// ── RENDER ───────────────────────────────────────────────────────
function render() {
  carrito = leerCarrito()
  const total = totalPares(carrito)

  if (!carrito.length) {
    document.getElementById('carrito-vacio').style.display = ''
    document.getElementById('carrito-contenido').style.display = 'none'
    document.getElementById('carrito-subtitle').textContent = 'Tu carrito está vacío'
    return
  }

  document.getElementById('carrito-vacio').style.display = 'none'
  document.getElementById('carrito-contenido').style.display = ''

  const totalItems = carrito.reduce((s, i) => s + i.cantidad, 0)
  document.getElementById('carrito-subtitle').textContent =
    `${totalItems} ${totalItems === 1 ? 'artículo' : 'artículos'} · ${total} ${total === 1 ? 'par' : 'pares'}`

  // Hint mayoreo
  const hint = document.getElementById('mayoreo-hint')
  const hintText = document.getElementById('mayoreo-hint-texto')
  if (total < 3) {
    hint.style.display = 'flex'
    hintText.innerHTML = `Agrega <strong>${3 - total} par${3 - total > 1 ? 'es' : ''} más</strong> y obtén precio de mayoreo (-$80/par)`
  } else if (total < 6) {
    hint.style.display = 'flex'
    hintText.innerHTML = `Agrega <strong>${6 - total} par${6 - total > 1 ? 'es' : ''} más</strong> para mayor descuento (-$150/par)`
  } else {
    hint.style.display = 'none'
  }

  // Items
  const list = document.getElementById('items-list')
  list.innerHTML = carrito.map((item, idx) => {
    const pares = item.es_corrida ? item.cantidad * 6 : item.cantidad
    const precioUnit = calcularPrecioUnitario(item, total)
    const subtotal = precioUnit * pares
    const imgHTML = item.imagen
      ? `<img class="item-img" src="${item.imagen}" alt="${item.nombre}" onerror="this.style.display='none'">`
      : `<div class="item-img-placeholder">👠</div>`
    const corridaBadge = item.es_corrida ? `<div class="item-corrida-badge">Corrida completa</div>` : ''
    return `
      <div class="item-card">
        ${imgHTML}
        <div class="item-info">
          ${corridaBadge}
          <div class="item-name" title="${item.nombre}">${item.nombre}</div>
          <div class="item-meta">${item.color || ''}${item.talla ? ' · Talla ' + item.talla : ''}${item.es_corrida ? ' · ' + pares + ' pares' : ''}</div>
          <div class="item-price">$${subtotal.toFixed(0)} MXN
            <span class="item-price-each">($${precioUnit.toFixed(0)}/par)</span>
          </div>
          ${!item.es_corrida ? `
          <div class="item-qty">
            <button class="qty-btn" onclick="cambiarCantidad(${idx}, -1)" aria-label="Quitar uno">−</button>
            <span class="qty-val">${item.cantidad}</span>
            <button class="qty-btn" onclick="cambiarCantidad(${idx}, 1)" aria-label="Agregar uno">+</button>
          </div>` : ''}
        </div>
        <button class="item-remove" onclick="eliminarItem(${idx})" title="Eliminar" aria-label="Eliminar producto">✕</button>
      </div>`
  }).join('')

  // Resumen con envío
  const resumenPrecios = carrito.map(item => {
    const pares = item.es_corrida ? item.cantidad * 6 : item.cantidad
    return calcularPrecioUnitario(item, total) * pares
  })
  const subtotalProductos = resumenPrecios.reduce((a, b) => a + b, 0)
  const subtotalSinDesc = carrito.reduce((s, item) => {
    const pares = item.es_corrida ? item.cantidad * 6 : item.cantidad
    return s + item.precio_menudeo * pares
  }, 0)
  const ahorro = subtotalSinDesc - subtotalProductos

  // Envío escalonado por número de pares
  function calcularEnvio(pares, subtotal) {
    if (subtotal >= cfgEnvio.gratis_desde) return 0
    if (pares >= 3) return cfgEnvio.tier3
    if (pares >= 2) return cfgEnvio.tier2
    return cfgEnvio.tier1
  }
  const costoEnvio = calcularEnvio(total, subtotalProductos)
  const totalFinal = subtotalProductos + costoEnvio

  let tipoDesc = ''
  if (total >= 6) tipoDesc = 'Precio mayoreo (6+ pares)'
  else if (total >= 3) tipoDesc = 'Precio mayoreo (3-5 pares)'

  let resumenHTML = `
    <div class="resumen-row"><span>Subtotal (${total} ${total === 1 ? 'par' : 'pares'})</span><span>$${subtotalSinDesc.toFixed(0)} MXN</span></div>`
  if (ahorro > 0) {
    resumenHTML += `<div class="resumen-row" style="color:var(--tan)"><span>${tipoDesc}</span><span>−$${ahorro.toFixed(0)} MXN</span></div>`
    resumenHTML += `<div class="resumen-row"><span>Subtotal productos</span><span>$${subtotalProductos.toFixed(0)} MXN</span></div>`
  }

  if (costoEnvio === 0) {
    resumenHTML += `<div class="resumen-row" style="color:#22c55e"><span>Envío 🚚</span><span style="font-weight:700">¡GRATIS!</span></div>`
  } else {
    const faltanParaGratis = cfgEnvio.gratis_desde - subtotalProductos
    resumenHTML += `
      <div class="resumen-row">
        <span>Envío 🚚
          <span style="font-size:0.7rem;color:var(--gray);display:block;margin-top:2px">
            Gratis a partir de $${cfgEnvio.gratis_desde.toFixed(0)} MXN
            ${faltanParaGratis > 0 ? `· faltan $${faltanParaGratis.toFixed(0)}` : ''}
          </span>
        </span>
        <span>$${costoEnvio.toFixed(0)} MXN</span>
      </div>`
  }

  resumenHTML += `
    <div class="resumen-row total">
      <span>Total</span>
      <span class="val">$${totalFinal.toFixed(0)} MXN</span>
    </div>`

  document.getElementById('resumen-box').innerHTML = resumenHTML
  document.getElementById('modal-total').textContent = '$' + totalFinal.toFixed(0) + ' MXN'
  // Guardar para usar en procesarPago
  window._carritoTotal = totalFinal
  window._costoEnvio = costoEnvio
  window._subtotalProductos = subtotalProductos
}

function cambiarCantidad(idx, delta) {
  carrito[idx].cantidad = Math.max(1, carrito[idx].cantidad + delta)
  // Recalcular precio_unitario con el nuevo total
  const total = totalPares(carrito)
  carrito.forEach(item => {
    item.precio_unitario = calcularPrecioUnitario(item, total)
  })
  guardarCarrito()
  render()
}

function eliminarItem(idx) {
  carrito.splice(idx, 1)
  guardarCarrito()
  render()
  mostrarToast('Producto eliminado')
}

// ── TOAST ────────────────────────────────────────────────────────
function mostrarToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  clearTimeout(t._timer)
  t._timer = setTimeout(() => t.classList.remove('show'), 2400)
}

// ── CHECKOUT ─────────────────────────────────────────────────────
function abrirCheckout() {
  if (!carrito.length) return
  // Navega a la página dedicada /checkout (para tracking de funnel Meta/TikTok/Google)
  window.location.href = '/checkout'
}

function cerrarCheckout() {
  document.getElementById('checkout-overlay').classList.remove('active')
}

async function procesarPago() {
  const nombre   = document.getElementById('co-nombre').value.trim()
  const email    = document.getElementById('co-email').value.trim()
  const telefono = document.getElementById('co-telefono').value.trim()
  const calle    = document.getElementById('co-calle').value.trim()
  const colonia  = document.getElementById('co-colonia').value.trim()
  const cp       = document.getElementById('co-cp').value.trim()
  const ciudad   = document.getElementById('co-ciudad').value.trim()
  const estado   = document.getElementById('co-estado').value.trim()
  const notas    = document.getElementById('co-notas').value.trim()

  if (!nombre || !email || !telefono || !calle || !colonia || !cp || !ciudad || !estado) {
    mostrarToast('Completa todos los campos requeridos')
    return
  }

  const btn = document.getElementById('btn-confirmar')
  btn.disabled = true
  btn.textContent = 'Procesando...'

  try {
    const pTotal = totalPares(carrito)
    const totalFinal    = window._carritoTotal    || 0
    const costoEnvio    = window._costoEnvio      || 0
    const subtotalProds = window._subtotalProductos || 0

    // Crear pedido (total incluye envío)
    const resPedido = await fetch(`${API}/pedidos/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: carrito.map(i => ({
          variante_id: i.variante_id,
          cantidad: i.es_corrida ? i.cantidad * 6 : i.cantidad,
          precio_unitario: calcularPrecioUnitario(i, pTotal),
          nombre: i.nombre, color: i.color, talla: i.talla
        })),
        total: totalFinal,
        costo_envio: costoEnvio,
        status: 'borrador',
        nombre_cliente: nombre, email_cliente: email,
        telefono_cliente: telefono,
        direccion_envio: `${calle}, ${colonia}, CP ${cp}, ${ciudad}, ${estado}`,
        notas
      })
    })
    const pedido = await resPedido.json()
    if (!pedido.id) throw new Error('Error creando pedido')

    // Armar items para MercadoPago (productos + envío si aplica)
    const mpItems = carrito.map(i => ({
      nombre: i.nombre + ' - ' + i.color + (i.talla ? ' T:' + i.talla : ''),
      cantidad: i.es_corrida ? i.cantidad * 6 : i.cantidad,
      precio: calcularPrecioUnitario(i, pTotal)
    }))
    if (costoEnvio > 0) {
      mpItems.push({ nombre: 'Envío a domicilio', cantidad: 1, precio: costoEnvio })
    }

    // Crear preferencia de pago
    const resPago = await fetch(`${API}/pagos/crear-preferencia`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pedido_id: pedido.id,
        items: mpItems,
        cliente: { nombre, email },
        total: totalFinal
      })
    })
    const pago = await resPago.json()
    if (!pago.init_point) throw new Error('Error creando pago')

    // Guardar IDs para evento Purchase
    try {
      const ids = carrito.map(i => i.sku_interno || i.producto_id)
      sessionStorage.setItem('fbq_checkout_ids', JSON.stringify(ids))
    } catch(e) {}

    // Pixels
    if (window.fbq) fbq('track', 'InitiateCheckout', { value: totalFinal, currency: 'MXN', num_items: total })
    if (window.ttq) ttq.track('InitiateCheckout', { value: totalFinal, currency: 'MXN' })
    if (typeof gtag === 'function') gtag('event', 'begin_checkout', { currency: 'MXN', value: totalFinal })

    window.location.href = pago.init_point
  } catch(e) {
    btn.disabled = false
    btn.textContent = 'Pagar ahora'
    mostrarToast('Error al procesar. Intenta de nuevo.')
  }
}

function _dispararViewCart() {
  if (!carrito.length) return
  const total = totalPares(carrito)
  const valor = carrito.reduce((s,i)=>{ const pares=i.es_corrida?i.cantidad*6:i.cantidad; return s + calcularPrecioUnitario(i,total)*pares }, 0)
  const ids = carrito.map(i => i.sku_interno || i.producto_id)
  // Evento "ViewCart" en Meta (custom), TikTok y GA4 (view_cart)
  if (window.fbq) fbq('trackCustom', 'ViewCart', { content_ids: ids, value: valor, currency:'MXN', num_items: total })
  if (window.ttq) ttq.track('ViewCart', { value: valor, currency:'MXN', contents: ids.map(id=>({content_id:id})) })
  if (typeof gtag === 'function') gtag('event', 'view_cart', { currency:'MXN', value: valor })
}

// ── INIT ─────────────────────────────────────────────────────────
async function init() {
  // Restaurar carrito desde un email de recordatorio (?recover=<id>)
  const _recoverId = new URLSearchParams(location.search).get('recover')
  if (_recoverId) {
    try {
      const r = await fetch(`${API}/carrito-abandonado/recuperar/${_recoverId}`)
      const d = await r.json()
      if (d.ok && d.items && d.items.length) {
        sessionStorage.setItem('zm_carrito', JSON.stringify(d.items))
      }
    } catch(e) {}
    history.replaceState(null, '', '/carrito')
  }

  // Cargar config de envío del backend
  try {
    const r = await fetch(`${API}/config/envio`)
    if (r.ok) cfgEnvio = await r.json()
  } catch(e) { /* usa defaults */ }
  render()

  // Cargar pixeles SOLO con consentimiento
  try {
    const res = await fetch(`${API}/seo/config`)
    const data = await res.json()
    const config = {}
    if (Array.isArray(data)) data.forEach(item => config[item.clave] = item.valor || '')
    else Object.assign(config, data)
    if (localStorage.getItem('zm_consent') === 'accepted') {
      cargarPixeles(config)
      setTimeout(_dispararViewCart, 800)
    }
  } catch(e) {}
}
init()
